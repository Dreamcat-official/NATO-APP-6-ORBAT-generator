<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NATO 战术编制图 (ORBAT) 编辑器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8fafc;
      --panel-bg: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --subtext: #64748b;
      --stroke: #000000;
      --active: #2563eb;
      --hover: #f1f5f9;
      --danger: #ef4444;
    }
    body.dark-mode {
      --bg: #090d16;
      --panel-bg: #131b2e;
      --border: #232f48;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --stroke: #ffffff;
      --active: #38bdf8;
      --hover: #1e293b;
      --danger: #f87171;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 13px;
    }

    /* 顶栏导航 */
    header {
      height: 48px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
      flex-shrink: 0;
      z-index: 30;
    }
    .header-title-box { display: flex; align-items: center; overflow: hidden; white-space: nowrap; }
    .header-title { font-size: 14px; font-weight: 800; letter-spacing: 0.3px; }
    .header-subtitle { font-size: 11px; color: var(--subtext); margin-left: 8px; font-weight: normal; }
    .header-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }

    /* 通用按钮 */
    button {
      background: var(--panel-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 5px 9px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    button:hover { background: var(--hover); border-color: var(--text); }
    button.primary { background: var(--active); color: #ffffff; border-color: var(--active); }
    button.primary:hover { opacity: 0.9; }
    button.danger { color: var(--danger); border-color: var(--danger); }
    button.danger:hover { background: rgba(239, 68, 68, 0.1); }
    button.sm { padding: 3px 6px; font-size: 11px; }

    /* 手机端专用分屏 Tab */
    .mobile-tab-bar {
      display: none;
      height: 40px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 25;
    }
    .mobile-tab-btn {
      flex: 1;
      height: 100%;
      border: none;
      border-radius: 0;
      background: transparent;
      color: var(--subtext);
      font-size: 12px;
      font-weight: 700;
      border-bottom: 2px solid transparent;
      justify-content: center;
    }
    .mobile-tab-btn.active {
      color: var(--active);
      border-bottom-color: var(--active);
      background: var(--hover);
    }

    /* 布局容器 */
    .app-workspace {
      display: flex;
      flex: 1;
      height: calc(100vh - 48px);
      overflow: hidden;
      position: relative;
    }

    /* 1. 左侧栏：编制大纲 */
    .pane-outline {
      width: 260px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 10;
    }
    .pane-header {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      flex-shrink: 0;
    }
    .spacing-controls {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-bg);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--subtext);
      font-weight: 600;
    }
    .slider-row input[type="range"] {
      width: 100px;
      cursor: pointer;
    }
    .outline-content {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .tree-node-item {
      padding: 6px 8px;
      margin-bottom: 4px;
      border-radius: 4px;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 12px;
    }
    .tree-node-item:hover { background: var(--hover); }
    .tree-node-item.selected {
      background: var(--hover);
      border-color: var(--active);
      font-weight: 700;
    }
    .col-group {
      margin-top: 10px;
      border: 1px dashed var(--border);
      border-radius: 4px;
      padding: 6px;
    }
    .col-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--subtext);
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }

    /* 2. 中间核心画布 */
    .pane-canvas {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
    }
    .pane-canvas:active { cursor: grabbing; }
    .canvas-toolbar {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 4px;
      background: var(--panel-bg);
      padding: 4px;
      border-radius: 5px;
      border: 1px solid var(--border);
      z-index: 10;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .canvas-viewport {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    #orbat-svg {
      transform-origin: 0 0;
      position: absolute;
      top: 0;
      left: 0;
      user-select: none;
    }
    .clickable-node { cursor: pointer; }

    /* 3. 右侧属性检查器 */
    .pane-inspector {
      width: 280px;
      background: var(--panel-bg);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
      z-index: 10;
    }
    .form-group {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--subtext);
      margin-bottom: 5px;
    }
    .form-group input[type="text"],
    .form-group select {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
    }
    .form-group input[type="text"]:focus,
    .form-group select:focus {
      border-color: var(--active);
    }

    /* 战术矩阵全色板 (图 3 风格) */
    .tactical-matrix-palette {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 3px;
      background: #3e4438;
      padding: 6px;
      border-radius: 4px;
      border: 1px solid #23271f;
      margin-top: 6px;
    }
    .matrix-color-cell {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 2px;
      border: 1px solid rgba(0,0,0,0.4);
      cursor: pointer;
      padding: 0;
      transition: transform 0.1s, border-color 0.1s;
    }
    .matrix-color-cell:hover {
      transform: scale(1.18);
      border-color: #ffffff;
      z-index: 2;
    }

    /* 手机端自适应分屏架构 (<= 900px) */
    @media (max-width: 900px) {
      .header-subtitle { display: none; }
      .header-actions button span.btn-text { display: none; }
      
      .mobile-tab-bar { display: flex; }
      .app-workspace {
        flex-direction: column;
        height: calc(100vh - 48px - 40px);
      }
      
      .pane-canvas {
        order: 1;
        height: 48vh;
        flex: none;
        width: 100%;
        border-bottom: 1px solid var(--border);
      }

      .pane-outline {
        order: 2;
        width: 100% !important;
        flex: 1;
        border-right: none;
      }
      .pane-inspector {
        order: 2;
        width: 100% !important;
        flex: 1;
        border-left: none;
      }

      body.mobile-tab-outline .pane-inspector { display: none !important; }
      body.mobile-tab-outline .pane-outline { display: flex !important; }

      body.mobile-tab-inspector .pane-outline { display: none !important; }
      body.mobile-tab-inspector .pane-inspector { display: flex !important; }
    }
  </style>
</head>
<body class="mobile-tab-outline">

  <!-- 顶栏 -->
  <header>
    <div class="header-title-box">
      <span class="header-title">NATO 编制图编辑器</span>
      <span class="header-subtitle">APP-6 矢量标准 / 通用合成旅规范</span>
    </div>
    <div class="header-actions">
      <button class="danger" onclick="clearAllOrbat()" title="清空全部编制">🗑️<span class="btn-text"> 清空</span></button>
      <button onclick="resetToStandardBrigade()" title="重置为默认编制">🔄<span class="btn-text"> 重置</span></button>
      <button onclick="toggleDarkMode()" title="浅色/深色切换">🌓<span class="btn-text"> 昼夜</span></button>
      <button class="primary" onclick="exportSVG()" title="导出纯净矢量 SVG">SVG</button>
      <button onclick="exportPNG(false)" title="导出带底色 2x PNG">2xPNG</button>
      <button onclick="exportPNG(true)" title="导出透明底板 2x PNG">透明PNG</button>
    </div>
  </header>

  <!-- 移动端分屏切换 Tab -->
  <nav class="mobile-tab-bar">
    <button class="mobile-tab-btn active" id="btn-tab-outline" onclick="switchMobileTab('outline')">📋 编制拓扑大纲</button>
    <button class="mobile-tab-btn" id="btn-tab-inspector" onclick="switchMobileTab('inspector')">⚙️ 属性检查器</button>
  </nav>

  <!-- 工作区 -->
  <div class="app-workspace">

    <!-- 1. 编制大纲 -->
    <aside class="pane-outline">
      <div class="pane-header">
        <span>编制拓扑结构</span>
        <button class="sm primary" onclick="addNewColumn()">➕ 横向加列</button>
      </div>
      <div class="spacing-controls">
        <div class="slider-row">
          <span>列间距: <strong id="label-col-gap">54px</strong></span>
          <input type="range" id="slider-col-gap" min="20" max="140" value="54" oninput="onColGapChange(this.value)">
        </div>
        <div class="slider-row">
          <span>行间距: <strong id="label-row-gap">32px</strong></span>
          <input type="range" id="slider-row-gap" min="16" max="70" value="32" oninput="onRowGapChange(this.value)">
        </div>
      </div>
      <div class="outline-content" id="outline-tree"></div>
    </aside>

    <!-- 2. 中间核心画布 (手机端上半屏) -->
    <main class="pane-canvas" id="canvas-container">
      <div class="canvas-toolbar">
        <button class="sm" onclick="zoomCanvas(0.15)">➕</button>
        <button class="sm" onclick="zoomCanvas(-0.15)">➖</button>
        <button class="sm" onclick="fitToScreen()">🎯 适应</button>
        <button class="sm" onclick="resetZoom()">100%</button>
      </div>
      <div class="canvas-viewport" id="viewport">
        <svg id="orbat-svg"></svg>
      </div>
    </main>

    <!-- 3. 属性检查器 (手机端点击兵牌自动切入) -->
    <aside class="pane-inspector">
      <div class="pane-header">
        <span>节点属性编辑</span>
        <div style="display: flex; gap: 4px; align-items: center;">
          <span id="selected-type-badge" style="font-size: 10px; color: var(--subtext);">未选择</span>
          <button class="sm" onclick="switchMobileTab('outline')">← 大纲</button>
        </div>
      </div>

      <div id="inspector-fields" style="display: none;">
        <div class="form-group">
          <label>单位全称 (Title)</label>
          <input type="text" id="node-title" oninput="updateCurrentNode('title', this.value)">
        </div>
        <div class="form-group">
          <label>装备型号/编制描述 (Desc)</label>
          <input type="text" id="node-desc" oninput="updateCurrentNode('desc', this.value)">
        </div>
        <div class="form-group" id="col-layout-box" style="display: none;">
          <label>当前列排版形态 (Column Layout)</label>
          <div style="display: flex; gap: 6px;">
            <button class="sm" id="btn-layout-commander" style="flex: 1;" onclick="setColType('commander')">主官领队型 (图2)</button>
            <button class="sm" id="btn-layout-direct" style="flex: 1;" onclick="setColType('direct')">直属顺下列 (图3)</button>
          </div>
        </div>
        <div class="form-group" id="side-select-box" style="display: none;">
          <label>旅总部侧挂方位 (Side)</label>
          <select id="node-side" onchange="updateCurrentNode('side', this.value)">
            <option value="right">右侧挂 (Right)</option>
            <option value="left">左侧挂 (Left)</option>
          </select>
        </div>
        <div class="form-group">
          <label>兵种大类 (Level 1)</label>
          <select id="node-cat" onchange="onCategoryChange()">
            <option value="hq">指挥与总部 (Headquarters)</option>
            <option value="joint">合成/联合力量 (Joint & Combined)</option>
            <option value="infantry">步兵 (Infantry)</option>
            <option value="armor">装甲 / 骑兵 (Armour)</option>
            <option value="artillery">炮兵 (Artillery)</option>
            <option value="antitank">反坦克 (Anti-Tank)</option>
            <option value="airdefense">防空与导弹 (Air Defence & Missiles)</option>
            <option value="engineer">军事工程兵 (Engineers)</option>
            <option value="aviation">空中力量 (Air Organizations)</option>
            <option value="support">战斗支援 (Other Support)</option>
            <option value="sustainment">后勤勤务 (Sustainment)</option>
            <option value="sof">特种作战 (SOF)</option>
          </select>
        </div>
        <div class="form-group">
          <label>具体兵种 (Level 2)</label>
          <select id="node-branch" onchange="updateCurrentNode('branch', this.value)"></select>
        </div>

        <!-- 战术全色矩阵 -->
        <div class="form-group">
          <label>底色自定义 (Color Fill)</label>
          <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 6px;">
            <input type="color" id="node-color" style="width: 38px; height: 28px; padding: 1px; border: 1px solid var(--border);" oninput="updateCurrentNode('color', this.value)">
            <input type="text" id="node-color-text" style="flex: 1;" oninput="updateCurrentNode('color', this.value)">
          </div>
          <div class="tactical-matrix-palette" id="tactical-palette-grid"></div>
        </div>

        <div class="form-group">
          <label>梯队层级 (Echelon)</label>
          <select id="node-echelon" onchange="updateCurrentNode('echelon', this.value)">
            <option value="">无 (None)</option>
            <option value="·">班 (·)</option>
            <option value="···">排 (···)</option>
            <option value="I">连 (I)</option>
            <option value="II">营 (II)</option>
            <option value="III">团 (III)</option>
            <option value="X">旅 (X)</option>
            <option value="XX">师 (XX)</option>
            <option value="XXXX">集团军 (XXXX)</option>
            <option value="XXXXXX">战区 (XXXXXX)</option>
          </select>
        </div>
        <div class="form-group">
          <label>机动交通方式 (Mobility)</label>
          <select id="node-mobility" onchange="updateCurrentNode('mobility', this.value)">
            <option value="none">默认 / 徒步 (None)</option>
            <option value="motorized">摩托化 (贯穿竖线)</option>
            <option value="towed">牵引式 (底置轮轴 o----o)</option>
            <option value="tracked">履带机械化 (胶囊圈)</option>
            <option value="wheeled">轮式机动 (内嵌三圆)</option>
            <option value="armour-wheeled">装甲轮式 (胶囊圈+下三圆)</option>
            <option value="airborne">伞降空降 (双凸弧鸥翼)</option>
            <option value="airmobile">空中突击 (小飞翼)</option>
            <option value="amphibious">两栖突击 (对称密波浪)</option>
            <option value="arctic">极地机动 (双卷端雪橇)</option>
          </select>
        </div>
        <div class="form-group">
          <label>特质角标 (Badge)</label>
          <select id="node-badge" onchange="updateCurrentNode('badge', this.value)">
            <option value="none">无 (None)</option>
            <option value="cbt">战斗 (CBT)</option>
            <option value="lo">联络 (LO)</option>
            <option value="sof">特战 (SOF)</option>
            <option value="spt">支援 (SPT)</option>
            <option value="light">轻型 (L)</option>
            <option value="heavy">重型 (H)</option>
            <option value="suw">岸舰海战 (SUW)</option>
            <option value="ta">目标指示 (TA)</option>
            <option value="fa">战斗轰炸 (F/A)</option>
            <option value="cargo">运输 (C)</option>
            <option value="patrol">巡逻 (P)</option>
            <option value="attack">武装攻击 (A)</option>
            <option value="utility">通用勤务 (U)</option>
            <option value="recon">空中侦察 (R)</option>
            <option value="aslt">空突机降 (ASLT)</option>
          </select>
        </div>
        <div class="form-group">
          <label>叠牌堆叠 (Stacks)</label>
          <select id="node-stacks" onchange="updateCurrentNode('stacks', parseInt(this.value)||1)">
            <option value="1">1 (单牌)</option>
            <option value="2">2 (双层堆叠)</option>
            <option value="3">3 (三层堆叠)</option>
            <option value="4">4 (四层堆叠)</option>
            <option value="5">5 (五层堆叠)</option>
          </select>
        </div>
        <div class="form-group">
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="checkbox" id="node-taskforce" onchange="updateCurrentNode('taskForce', this.checked)">
            <span>任务支队 (倒 冂 框)</span>
          </label>
        </div>
        <div class="form-group" id="node-actions-box"></div>
      </div>
      <div id="inspector-placeholder" style="padding: 24px; text-align: center; color: var(--subtext);">
        请在大纲或中央画布中点击选中单位进行编辑
      </div>
    </aside>

  </div>

  <script>
    let isDark = false;
    let colGap = 54;
    let rowGap = 32;

    let panX = 40, panY = 40, zoomScale = 1.0;
    let isPanning = false, startMouseX = 0, startMouseY = 0;

    // 50 色实战战术色盘矩阵
    const TACTICAL_MATRIX_COLORS = [
      "#1a3a6b", "#2c4d82", "#3b6bb3", "#4d84d6", "#5B8FF9", "#80B3FF", "#a3c8ff", "#0ea5e9", "#38bdf8", "#99D9EA",
      "#14532d", "#15803d", "#16a34a", "#22c55e", "#4ade80", "#538242", "#65a30d", "#84cc16", "#a3e635", "#bef264",
      "#78350f", "#92400e", "#b45309", "#d97706", "#f59e0b", "#fbbf24", "#fcd34d", "#E5B02B", "#fde047", "#fef08a",
      "#7f1d1d", "#991b1b", "#b91c1c", "#dc2626", "#ef4444", "#E52B2B", "#D66F11", "#ea580c", "#f97316", "#fb923c",
      "#0f172a", "#1e293b", "#334155", "#475569", "#64748b", "#94a3b8", "#cbd5e1", "#e2e8f0", "#f8fafc", "#FFFFFF"
    ];

    // 100% 完整保留的二级兵种映射表（严禁修改或删减）
    const BRANCH_HIERARCHY = {
      hq: [
        { id: "hq", name: "通用指挥所/旅营总部 (Headquarters - 单顶横线)" },
        { id: "hq-service", name: "指挥与勤务部 (HQ & Service - 双横线)" },
        { id: "hq-text", name: "司令部 (正中大字 HQ)" },
        { id: "hq-staff", name: "战术旗杆指挥所 (纯左下旗杆)" },
        { id: "hq-infantry", name: "步兵指挥所 (Infantry HQ - 单横线+旗杆)" },
        { id: "hq-armor", name: "装甲指挥所 (Armour HQ - 胶囊圈+单横线)" },
        { id: "hq-artillery", name: "炮兵指挥所 (Artillery HQ - 实心圆+单横线)" }
      ],
      joint: [
        { id: "unspecified-combined", name: "非特定/综合合成力量 (Combined Arms)" },
        { id: "jtf", name: "联合特遣部队 (JTF)" },
        { id: "mtf", name: "海上特遣部队 (MTF)" },
        { id: "ltf", name: "陆上特遣部队 (LTF)" },
        { id: "atf", name: "空中特遣部队 (ATF)" },
        { id: "combined-mech", name: "合成机械化部队 (内接四角 X)" },

          type: "commander", // 【形态一：主官领队型】
          units: [
            { id: "u_6", title: "第1自行加榴炮营", desc: "155mm自行火炮 x 18", color: "#5B8FF9", branch: "artillery", mobility: "tracked", echelon: "II" },
            { id: "u_7", title: "第2自行加榴炮营", desc: "155mm自行火炮 x 18", color: "#5B8FF9", branch: "artillery", mobility: "tracked", echelon: "II" }
          ]
        },
        {
          id: "col_direct",
          title: "旅直属支援连队",
          type: "direct", // 【形态二：直属平级顺下列】
          units: [
            { id: "u_8",  title: "战斗勤务支援营", desc: "旅综合后勤大队", color: "#5B8FF9", branch: "sustainment", echelon: "II" },
            { id: "u_9",  title: "装甲侦察搜索连", desc: "装甲搜索车",     color: "#5B8FF9", branch: "recon", echelon: "I" },
            { id: "u_10", title: "野战防空导弹连", desc: "近程低空防御",   color: "#5B8FF9", branch: "air-defense", echelon: "I" },
            { id: "u_11", title: "战斗工程破障连", desc: "工程破障与架桥", color: "#5B8FF9", branch: "engineer", badge: "cbt", echelon: "I" },
            { id: "u_12", title: "战术信息通信连", desc: "多路战术通信",   color: "#5B8FF9", branch: "cis", echelon: "I" },
            { id: "u_13", title: "军事情报联络连", desc: "情报联络侦察",   color: "#5B8FF9", branch: "mi", badge: "lo", echelon: "I" },
            { id: "u_14", title: "核生化防卫连",   desc: "三防洗消与侦检", color: "#5B8FF9", branch: "cbrn", echelon: "I" }
          ]
        }
      ]
    };

    let orbatData = JSON.parse(JSON.stringify(initialOrbatData));
    let selectedRef = { type: "root", colIdx: null, unitIdx: null };

    // 获取单位几何顶界（用于主官卡片顶部的呼吸断口计算）
    function getUnitVisualTop(unit) {
      if (!unit) return 24;
      if (unit.taskForce) return 6;
      if (unit.echelon && unit.echelon.trim() !== "" && unit.echelon !== "none") {
        if (unit.echelon === "·" || unit.echelon === "···") return 12;
        if (unit.echelon === "X" || unit.echelon === "XX" || unit.echelon === "XXXX" || unit.echelon === "XXXXXX") return 7;
        return 9;
      }
      return 24;
    }

    function findCategoryByBranch(branchId) {
      for (const [cat, list] of Object.entries(BRANCH_HIERARCHY)) {
        if (list.some(b => b.id === branchId)) return cat;
      }
      return "infantry";
    }

    // 核心树排版引擎（图层隔离：彻底消除腰部弯线，还原左下角直垂母线 + 18px 向右缩进）
    function renderTree() {
      const svg = document.getElementById("orbat-svg");
      const strokeColor = isDark ? "#FFFFFF" : "#000000";

      const CARD_W = 270;
      const CARD_H = 76;
      const TOP_PAD = 40;
      const LEFT_PAD = 70;
      const BOX_CX = 46;
      const BOX_LEFT_OFFSET = 10;
      const BOX_CY_OFFSET = 46;
      const SUB_INDENT = 18; // 下属卡片向右统一缩进 18px

      const numCols = orbatData.columns.length;
      let colPositions = [];

      for (let i = 0; i < numCols; i++) {
        const x = LEFT_PAD + i * (CARD_W + colGap);
        colPositions.push({ x, cx: x + BOX_CX });
      }

      // 根节点中轴
      let trunkX = LEFT_PAD + CARD_W / 2;
      if (numCols > 0) {
        trunkX = (colPositions[0].cx + colPositions[numCols - 1].cx) / 2;
      }
      const rootX = trunkX - BOX_CX;
      const rootY = TOP_PAD;
      const rootBottomY = rootY + 68 + (((orbatData.root.stacks || 1) - 1) * 5);

      // 中轴单独侧挂总部 (HQ)
      const hq = orbatData.hqAttachment;
      const hasHq = !!hq;
      const attachY = rootBottomY + 44;
      const attachJuncY = attachY - 14;

      let hqPos = null;
      if (hasHq) {
        const isLeft = (hq.side || "right") === "left";
        const hqX = isLeft ? (trunkX - 44 - CARD_W) : (trunkX + 44);
        hqPos = { x: hqX, y: attachY, cx: hqX + BOX_CX, isLeft };
      }

      const busY = hasHq ? (attachY + 68 + 44) : (rootBottomY + 44);
      const colStartY = busY + 36;

      let svgUnitsMarkup = "";
      let linesMarkup = "";
      let selectionMarkup = "";

      // A. 主干中轴垂线
      linesMarkup += `<line x1="${trunkX}" y1="${rootBottomY}" x2="${trunkX}" y2="${busY}" stroke="${strokeColor}" stroke-width="2" />`;

      // B. HQ 侧挂连线
      if (hasHq) {
        const endY = hqPos.y + getUnitVisualTop(hq) - 7;
        linesMarkup += `
          <line x1="${trunkX}" y1="${attachJuncY}" x2="${hqPos.cx}" y2="${attachJuncY}" stroke="${strokeColor}" stroke-width="2" />
          <line x1="${hqPos.cx}" y1="${attachJuncY}" x2="${hqPos.cx}" y2="${endY}" stroke="${strokeColor}" stroke-width="2" />
        `;
      }

      let minBusX = trunkX;
      let maxBusX = trunkX;

      let maxCanvasY = colStartY;
      let minCanvasX = Math.min(rootX, hasHq ? hqPos.x : rootX, numCols > 0 ? colPositions[0].x : rootX);
      let maxCanvasX = Math.max(
        rootX + CARD_W,
        hasHq ? (hqPos.x + CARD_W) : rootX + CARD_W,
        numCols > 0 ? (colPositions[numCols - 1].x + CARD_W + SUB_INDENT) : rootX + CARD_W
      );

      // C. 遍历渲染各列（重构：顶层卡片左下角直垂母线，下级卡片向右缩进 18px）
      orbatData.columns.forEach((col, cIdx) => {
        const colPos = colPositions[cIdx];
        const colType = col.type || "commander";
        const busX = colPos.x + BOX_LEFT_OFFSET; // 垂直母线 X 轴直接锁定在列内标准左边框处

        minCanvasX = Math.min(minCanvasX, busX - 10);

        if (colType === "commander") {
          // ==================== 形态一：主官领队型 (图 2：左下角直垂母线 + 下级卡片右缩进 18px) ====================
          minBusX = Math.min(minBusX, colPos.cx);
          maxBusX = Math.max(maxBusX, colPos.cx);

          const u0 = col.units[0];
          const u0y = colStartY;
          maxCanvasY = Math.max(maxCanvasY, u0y + CARD_H + 40);

          // 大梁竖线直下接入主官卡片顶部中点（呼吸断口）
          const u0Top = u0y + getUnitVisualTop(u0);
          linesMarkup += `<line x1="${colPos.cx}" y1="${busY}" x2="${colPos.cx}" y2="${u0Top - 7}" stroke="${strokeColor}" stroke-width="2" />`;

          // 绘制主官卡片（无缩进，左边框在 busX 处）
          const isU0Sel = selectedRef.type === "column" && selectedRef.colIdx === cIdx && selectedRef.unitIdx === 0;
          svgUnitsMarkup += renderCardUnit(u0, colPos.x, u0y, `selectNode('column', ${cIdx}, 0)`);
          if (isU0Sel) selectionMarkup += renderSelectionHighlight(u0, colPos.x, u0y);

          // 若存在后续下属营/连单位
          if (col.units.length > 1) {
            // 【核心修正】：垂直母线起点严格锁定在主官卡片的左下角 (busX, u0y + 68)！绝无腰部横伸！
            const u0Bottom = u0y + 68 + (((u0.stacks || 1) - 1) * 5);
            const lastSubY = colStartY + (col.units.length - 1) * (CARD_H + rowGap) + BOX_CY_OFFSET;

            // 垂直母线自左下角笔直向下直垂到底部
            linesMarkup += `<line x1="${busX}" y1="${u0Bottom}" x2="${busX}" y2="${lastSubY}" stroke="${strokeColor}" stroke-width="2" />`;

            // 下属单位统一向右缩进 18px，水平短线从直垂母线直插下属卡片左边框中点
            for (let uIdx = 1; uIdx < col.units.length; uIdx++) {
              const unit = col.units[uIdx];
              const uy = colStartY + uIdx * (CARD_H + rowGap);
              maxCanvasY = Math.max(maxCanvasY, uy + CARD_H + 40);

              const subX = colPos.x + SUB_INDENT;
              const subBoxLeft = subX + BOX_LEFT_OFFSET; // busX + 18
              const cardCenterY = uy + BOX_CY_OFFSET;

              // 短水平横线从母线向右引出：从 busX 直达 busX + 18
              linesMarkup += `<line x1="${busX}" y1="${cardCenterY}" x2="${subBoxLeft}" y2="${cardCenterY}" stroke="${strokeColor}" stroke-width="2" />`;

              const isSel = selectedRef.type === "column" && selectedRef.colIdx === cIdx && selectedRef.unitIdx === uIdx;
              svgUnitsMarkup += renderCardUnit(unit, subX, uy, `selectNode('column', ${cIdx}, ${uIdx})`);
              if (isSel) selectionMarkup += renderSelectionHighlight(unit, subX, uy);
            }
          }

        } else {
          // ==================== 形态二：直属平级顺下列 (母线自大梁直垂 + 全员右缩进 18px) ====================
          minBusX = Math.min(minBusX, busX);
          maxBusX = Math.max(maxBusX, busX);

          const lastCardCenterY = colStartY + (col.units.length - 1) * (CARD_H + rowGap) + BOX_CY_OFFSET;

          // 大梁直角下弯形成的垂直母线
          linesMarkup += `<line x1="${busX}" y1="${busY}" x2="${busX}" y2="${lastCardCenterY}" stroke="${strokeColor}" stroke-width="2" />`;

          col.units.forEach((unit, uIdx) => {
            const uy = colStartY + uIdx * (CARD_H + rowGap);
            maxCanvasY = Math.max(maxCanvasY, uy + CARD_H + 40);

            const subX = colPos.x + SUB_INDENT;
            const subBoxLeft = subX + BOX_LEFT_OFFSET;
            const cardCenterY = uy + BOX_CY_OFFSET;

            // 水平短支线自垂直母线向右引出
            linesMarkup += `<line x1="${busX}" y1="${cardCenterY}" x2="${subBoxLeft}" y2="${cardCenterY}" stroke="${strokeColor}" stroke-width="2" />`;

            const isSel = selectedRef.type === "column" && selectedRef.colIdx === cIdx && selectedRef.unitIdx === uIdx;
            svgUnitsMarkup += renderCardUnit(unit, subX, uy, `selectNode('column', ${cIdx}, ${uIdx})`);
            if (isSel) selectionMarkup += renderSelectionHighlight(unit, subX, uy);
          });
        }
      });

      // 贯通上方水平主大梁
      if (numCols > 0) {
        linesMarkup += `<line x1="${minBusX}" y1="${busY}" x2="${maxBusX}" y2="${busY}" stroke="${strokeColor}" stroke-width="2" />`;
      }

      // 根节点
      const isRootSel = selectedRef.type === "root";
      svgUnitsMarkup += renderCardUnit(orbatData.root, rootX, rootY, `selectNode('root')`);
      if (isRootSel) selectionMarkup += renderSelectionHighlight(orbatData.root, rootX, rootY);

      // HQ 侧挂节点
      if (hasHq) {
        const isHqSel = selectedRef.type === "hqAttachment";
        svgUnitsMarkup += renderCardUnit(hq, hqPos.x, hqPos.y, `selectNode('hqAttachment')`);
        if (isHqSel) selectionMarkup += renderSelectionHighlight(hq, hqPos.x, hqPos.y);
      }

      const totalW = Math.max(maxCanvasX + 100, 1150);
      const totalH = Math.max(maxCanvasY, 780);

      svg.setAttribute("width", totalW.toString());
      svg.setAttribute("height", totalH.toString());
      svg.setAttribute("viewBox", `0 0 ${totalW} ${totalH}`);

      // 图层隔离
      svg.innerHTML = `
        <g id="scene-root">
          <g id="layer-content">
            <g id="layer-connections">${linesMarkup}</g>
            <g id="layer-units">${svgUnitsMarkup}</g>
          </g>
          <g id="layer-ui-selection">${selectionMarkup}</g>
        </g>
      `;

      applyTransform();
      renderOutlineTree();
      updateInspector();
    }

    function renderCardUnit(unit, x, y, onClickStr) {
      return `
        <g class="clickable-node" transform="translate(${x}, ${y})" onclick="${onClickStr}">
          ${renderNATOUnit(unit)}
        </g>
      `;
    }

    function renderSelectionHighlight(unit, x, y) {
      const activeColor = isDark ? "#38bdf8" : "#2563eb";
      return `
        <g transform="translate(${x}, ${y})" pointer-events="none">
          <rect class="node-hover-box" x="-4" y="0" width="${270 + ((unit.stacks||1)-1)*5 + 8}" height="76" fill="none" stroke="${activeColor}" stroke-width="2" stroke-dasharray="4,4" rx="4" />
        </g>
      `;
    }

    function renderOutlineTree() {
      const container = document.getElementById("outline-tree");
      let html = "";

      const rootSel = selectedRef.type === "root" ? "selected" : "";
      html += `
        <div class="tree-node-item ${rootSel}" onclick="selectNode('root')">
          <span>🏛️ <strong>${escapeHtml(orbatData.root.title)}</strong></span>
          <span style="font-size: 11px; color: var(--subtext);">${orbatData.root.echelon || "无"}</span>
        </div>
      `;

      html += `<div style="margin: 8px 0 4px 4px; font-size: 11px; font-weight: 700; color: var(--subtext);">中轴主干侧挂 (HQ Attachment)</div>`;
      
      if (orbatData.hqAttachment) {
        const sel = selectedRef.type === "hqAttachment" ? "selected" : "";
        const sideIcon = (orbatData.hqAttachment.side || "right") === "left" ? "👈" : "👉";
        html += `
          <div class="tree-node-item ${sel}" onclick="selectNode('hqAttachment')">
            <span>${sideIcon} ${escapeHtml(orbatData.hqAttachment.title)}</span>
            <button class="sm danger" onclick="event.stopPropagation(); removeHqAttachment()">✕</button>
          </div>
        `;
      } else {
        html += `<button class="sm" style="width: 100%; margin-bottom: 6px;" onclick="addHqAttachment()">➕ 侧挂旅总部 (HQ)</button>`;
      }

      html += `<div style="margin: 8px 0 4px 4px; font-size: 11px; font-weight: 700; color: var(--subtext);">下辖纵队阵列 (Columns)</div>`;

      orbatData.columns.forEach((col, cIdx) => {
        const isCmd = (col.type || "commander") === "commander";
        const layoutText = isCmd ? "主官领队" : "直属顺下";
        const colTitle = col.title || `第 ${cIdx + 1} 列`;
        html += `
          <div class="col-group">
            <div class="col-header">
              <span>${colTitle}</span>
              <div>
                <button class="sm" onclick="toggleColType(${cIdx})" title="切换本列形态（形态一:图2 / 形态二:图3）">${layoutText} ⇄</button>
                <button class="sm" onclick="addUnitToColumn(${cIdx})" title="追加下属分队">➕ 加单位</button>
                <button class="sm danger" onclick="removeColumn(${cIdx})" title="删除整列">✕</button>
              </div>
            </div>
        `;

        col.units.forEach((u, uIdx) => {
          const isSel = selectedRef.type === "column" && selectedRef.colIdx === cIdx && selectedRef.unitIdx === uIdx;
          const rolePrefix = (isCmd && uIdx === 0) ? "👑 " : "• ";
          html += `
            <div class="tree-node-item ${isSel ? 'selected' : ''}" onclick="selectNode('column', ${cIdx}, ${uIdx})">
              <span>${rolePrefix}${escapeHtml(u.title || "未命名分队")}</span>
              <span style="font-size: 10px; color: var(--subtext);">${u.echelon || ""}</span>
            </div>
          `;
        });

        html += `</div>`;
      });

      container.innerHTML = html;
    }

    function selectNode(type, colIdx = null, unitIdx = null) {
      selectedRef = { type, colIdx, unitIdx };
      renderTree();

      if (window.innerWidth <= 900) {
        switchMobileTab('inspector');
      }
    }

    function getSelectedUnit() {
      if (selectedRef.type === "root") return orbatData.root;
      if (selectedRef.type === "hqAttachment") return orbatData.hqAttachment;
      if (selectedRef.type === "column" && selectedRef.colIdx !== null && selectedRef.unitIdx !== null) {
        return orbatData.columns[selectedRef.colIdx]?.units[selectedRef.unitIdx] || null;
      }
      return null;
    }

    function updateInspector() {
      const unit = getSelectedUnit();
      const fields = document.getElementById("inspector-fields");
      const placeholder = document.getElementById("inspector-placeholder");
      const typeBadge = document.getElementById("selected-type-badge");
      const actionsBox = document.getElementById("node-actions-box");
      const sideBox = document.getElementById("side-select-box");
      const colLayoutBox = document.getElementById("col-layout-box");

      if (!unit) {
        fields.style.display = "none";
        placeholder.style.display = "block";
        typeBadge.textContent = "未选择";
        return;
      }

      fields.style.display = "block";
      placeholder.style.display = "none";

      if (selectedRef.type === "root") {
        typeBadge.textContent = "旅司令部 (Root)";
        sideBox.style.display = "none";
        colLayoutBox.style.display = "none";
      } else if (selectedRef.type === "hqAttachment") {
        typeBadge.textContent = "旅总部参谋组 (HQ)";
        sideBox.style.display = "block";
        colLayoutBox.style.display = "none";
        document.getElementById("node-side").value = unit.side || "right";
      } else {
        const curCol = orbatData.columns[selectedRef.colIdx];
        typeBadge.textContent = `${curCol.title || '纵队'} #${selectedRef.unitIdx + 1}`;
        sideBox.style.display = "none";
        colLayoutBox.style.display = "block";

        const isCmd = (curCol.type || "commander") === "commander";
        document.getElementById("btn-layout-commander").className = isCmd ? "sm primary" : "sm";
        document.getElementById("btn-layout-direct").className = !isCmd ? "sm primary" : "sm";
      }

      document.getElementById("node-title").value = unit.title || "";
      document.getElementById("node-desc").value = unit.desc || "";

      const cat = findCategoryByBranch(unit.branch || "infantry");
      document.getElementById("node-cat").value = cat;
      populateBranchOptions(cat, unit.branch);

      document.getElementById("node-color").value = unit.color || "#5B8FF9";
      document.getElementById("node-color-text").value = unit.color || "#5B8FF9";
      document.getElementById("node-echelon").value = unit.echelon !== undefined ? unit.echelon : "II";
      document.getElementById("node-mobility").value = unit.mobility || "none";
      document.getElementById("node-badge").value = unit.badge || "none";
      document.getElementById("node-stacks").value = (unit.stacks || 1).toString();
      document.getElementById("node-taskforce").checked = !!unit.taskForce;

      let actionsHtml = "";
      if (selectedRef.type === "column") {
        actionsHtml = `
          <div style="display: flex; gap: 6px; margin-top: 4px;">
            <button class="sm" style="flex: 1;" onclick="moveUnitOrder(-1)">🔼 上移</button>
            <button class="sm" style="flex: 1;" onclick="moveUnitOrder(1)">🔽 下移</button>
            <button class="sm danger" style="flex: 1;" onclick="deleteCurrentUnit()">🗑️ 删除</button>
          </div>
        `;
      } else if (selectedRef.type === "hqAttachment") {
        actionsHtml = `<button class="sm danger" style="width: 100%; margin-top: 4px;" onclick="removeHqAttachment()">🗑️ 移除此旅总部</button>`;
      }
      actionsBox.innerHTML = actionsHtml;
    }

    function populateBranchOptions(cat, selectedBranch) {
      const branchSelect = document.getElementById("node-branch");
      const list = BRANCH_HIERARCHY[cat] || [];
      branchSelect.innerHTML = list.map(item => `<option value="${item.id}">${item.name}</option>`).join("");
      if (selectedBranch) {
        branchSelect.value = selectedBranch;
      }
    }

    function onCategoryChange() {
      const cat = document.getElementById("node-cat").value;
      populateBranchOptions(cat);
      const newBranch = document.getElementById("node-branch").value;
      updateCurrentNode("branch", newBranch);
    }

    function updateCurrentNode(prop, value) {
      const unit = getSelectedUnit();
      if (!unit) return;
      unit[prop] = value;
      if (prop === "color") {
        document.getElementById("node-color").value = value;
        document.getElementById("node-color-text").value = value;
      }
      renderTree();
    }

    function setQuickColor(hex) {
      updateCurrentNode("color", hex);
    }

    function initTacticalMatrixPalette() {
      const container = document.getElementById("tactical-palette-grid");
      container.innerHTML = TACTICAL_MATRIX_COLORS.map(color => `
        <button class="matrix-color-cell" style="background: ${color};" onclick="setQuickColor('${color}')"></button>
      `).join("");
    }

    function toggleColType(cIdx) {
      const col = orbatData.columns[cIdx];
      col.type = (col.type === "direct") ? "commander" : "direct";
      renderTree();
    }

    function setColType(type) {
      if (selectedRef.type === "column" && selectedRef.colIdx !== null) {
        orbatData.columns[selectedRef.colIdx].type = type;
        renderTree();
      }
    }

    function addNewColumn() {
      const newColId = "col_" + Date.now();
      orbatData.columns.push({
        id: newColId,
        title: "新合成营部与分队",
        type: "commander",
        units: [
          { id: "u_" + Date.now(), title: "新建装甲步兵营", desc: "步兵战车 x 31", color: "#5B8FF9", branch: "infantry", mobility: "tracked", echelon: "II" }
        ]
      });
      selectedRef = { type: "column", colIdx: orbatData.columns.length - 1, unitIdx: 0 };
      renderTree();
    }

    function removeColumn(cIdx) {
      if (confirm(`确定删除第 ${cIdx + 1} 列及其所有下属分队吗？`)) {
        orbatData.columns.splice(cIdx, 1);
        selectedRef = { type: "root", colIdx: null, unitIdx: null };
        renderTree();
      }
    }

    function addUnitToColumn(cIdx) {
      const newUnit = {
        id: "u_" + Date.now(),
        title: "新下属连队",
        desc: "通用主战连",
        color: "#5B8FF9",
        branch: "infantry",
        echelon: "I"
      };
      orbatData.columns[cIdx].units.push(newUnit);
      selectedRef = { type: "column", colIdx: cIdx, unitIdx: orbatData.columns[cIdx].units.length - 1 };
      renderTree();
    }

    function deleteCurrentUnit() {
      if (selectedRef.type === "column" && selectedRef.colIdx !== null && selectedRef.unitIdx !== null) {
        orbatData.columns[selectedRef.colIdx].units.splice(selectedRef.unitIdx, 1);
        selectedRef = { type: "root", colIdx: null, unitIdx: null };
        renderTree();
      }
    }

    function moveUnitOrder(direction) {
      if (selectedRef.type !== "column") return;
      const units = orbatData.columns[selectedRef.colIdx].units;
      const oldIdx = selectedRef.unitIdx;
      const newIdx = oldIdx + direction;
      if (newIdx < 0 || newIdx >= units.length) return;
      const temp = units[oldIdx];
      units[oldIdx] = units[newIdx];
      units[newIdx] = temp;
      selectedRef.unitIdx = newIdx;
      renderTree();
    }

    function addHqAttachment() {
      orbatData.hqAttachment = { id: "hq", title: "旅总部 (HQ)", desc: "旅直属参谋组", color: "#5B8FF9", branch: "hq", echelon: "II", side: "right" };
      selectedRef = { type: "hqAttachment", colIdx: null, unitIdx: null };
      renderTree();
    }

    function removeHqAttachment() {
      orbatData.hqAttachment = null;
      selectedRef = { type: "root", colIdx: null, unitIdx: null };
      renderTree();
    }

    function onColGapChange(val) {
      colGap = parseInt(val);
      document.getElementById("label-col-gap").textContent = colGap + "px";
      renderTree();
    }
    function onRowGapChange(val) {
      rowGap = parseInt(val);
      document.getElementById("label-row-gap").textContent = rowGap + "px";
      renderTree();
    }

    function clearAllOrbat() {
      if (confirm("确定清空全部编制吗？所有下属纵队和旅总部将被移除，仅保留一个空白根节点。")) {
        orbatData = {
          root: { id: "root", title: "通用第一机甲旅", desc: "旅指挥部", color: "#5B8FF9", branch: "armor", echelon: "X" },
          hqAttachment: null,
          columns: []
        };
        selectedRef = { type: "root", colIdx: null, unitIdx: null };
        renderTree();
        fitToScreen();
      }
    }

    function resetToStandardBrigade() {
      if (confirm("确定重置为通用第一合成机甲旅标准编制？未保存的变动将丢失。")) {
        orbatData = JSON.parse(JSON.stringify(initialOrbatData));
        selectedRef = { type: "root", colIdx: null, unitIdx: null };
        renderTree();
        fitToScreen();
      }
    }

    function switchMobileTab(tab) {
      document.body.classList.remove('mobile-tab-outline', 'mobile-tab-inspector');
      document.body.classList.add(`mobile-tab-${tab}`);
      document.getElementById('btn-tab-outline').classList.toggle('active', tab === 'outline');
      document.getElementById('btn-tab-inspector').classList.toggle('active', tab === 'inspector');
    }

    function applyTransform() {
      const svg = document.getElementById("orbat-svg");
      svg.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomScale})`;
    }

    function zoomCanvas(delta) {
      zoomScale = Math.max(0.2, Math.min(3.0, zoomScale + delta));
      applyTransform();
    }

    function resetZoom() {
      zoomScale = 1.0;
      panX = 40;
      panY = 40;
      applyTransform();
    }

    function fitToScreen() {
      const svg = document.getElementById("orbat-svg");
      const container = document.getElementById("canvas-container");
      const contentLayer = document.getElementById("layer-content");

      let w = 1200, h = 800;
      if (contentLayer) {
        try {
          const bbox = contentLayer.getBBox();
          if (bbox.width > 0 && bbox.height > 0) {
            w = bbox.x + bbox.width + 40;
            h = bbox.y + bbox.height + 40;
          }
        } catch(e){}
      }

      const availW = container.clientWidth - 40;
      const availH = container.clientHeight - 40;

      zoomScale = Math.min(availW / w, availH / h, 1.0);
      zoomScale = Math.max(0.25, zoomScale);

      panX = (container.clientWidth - w * zoomScale) / 2;
      panY = Math.max(16, (container.clientHeight - h * zoomScale) / 2);
      applyTransform();
    }

    // 触控与鼠标平移支持
    const canvasContainer = document.getElementById("canvas-container");

    function handleStart(clientX, clientY, target) {
      if (target.closest(".clickable-node") || target.closest("button") || target.closest("input")) return;
      isPanning = true;
      startMouseX = clientX - panX;
      startMouseY = clientY - panY;
    }
    function handleMove(clientX, clientY) {
      if (!isPanning) return;
      panX = clientX - startMouseX;
      panY = clientY - startMouseY;
      applyTransform();
    }
    function handleEnd() { isPanning = false; }

    canvasContainer.addEventListener("mousedown", (e) => handleStart(e.clientX, e.clientY, e.target));
    window.addEventListener("mousemove", (e) => handleMove(e.clientX, e.clientY));
    window.addEventListener("mouseup", handleEnd);

    canvasContainer.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) handleStart(e.touches[0].clientX, e.touches[0].clientY, e.target);
    }, { passive: true });
    window.addEventListener("touchmove", (e) => {
      if (e.touches.length === 1) handleMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    window.addEventListener("touchend", handleEnd);

    canvasContainer.addEventListener("wheel", (e) => {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 0.08 : -0.08;
      zoomCanvas(delta);
    }, { passive: false });

    function toggleDarkMode() {
      isDark = !isDark;
      document.body.classList.toggle("dark-mode", isDark);
      renderTree();
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // ==================== 核心导出引擎：消除高亮边框 + 紧凑自适应裁切 ====================
    function getCroppedExportSVG() {
      const svg = document.getElementById("orbat-svg");
      const contentLayer = document.getElementById("layer-content");

      // 1. 调用 getBBox() 获得纯净战术内容包围盒（彻底排除高亮框）
      let bbox;
      try {
        bbox = contentLayer ? contentLayer.getBBox() : svg.getBBox();
      } catch (e) {
        bbox = null;
      }

      const padding = 40; // 紧凑 40px 呼吸边距
      let cropX, cropY, cropW, cropH;

      if (bbox && bbox.width > 0 && bbox.height > 0) {
        cropX = Math.floor(bbox.x - padding);
        cropY = Math.floor(bbox.y - padding);
        cropW = Math.ceil(bbox.width + padding * 2);
        cropH = Math.ceil(bbox.height + padding * 2);
      } else {
        cropX = 0;
        cropY = 0;
        cropW = parseFloat(svg.getAttribute("width")) || 1200;
        cropH = parseFloat(svg.getAttribute("height")) || 800;
      }

      // 2. 克隆 SVG DOM
      const clone = svg.cloneNode(true);

      // 3. 彻底删除克隆体内的 UI 选中高亮层
      const selLayer = clone.querySelector("#layer-ui-selection");
      if (selLayer) selLayer.remove();
      clone.querySelectorAll(".node-hover-box").forEach(el => el.remove());

      // 4. 重置样式与精确设定紧凑 ViewBox
      clone.style.transform = "";
      clone.setAttribute("width", cropW.toString());
      clone.setAttribute("height", cropH.toString());
      clone.setAttribute("viewBox", `${cropX} ${cropY} ${cropW} ${cropH}`);

      if (!clone.getAttribute("xmlns")) {
        clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      }

      return { clone, cropW, cropH };
    }

    // 导出纯净矢量 SVG
    function exportSVG() {
      const { clone } = getCroppedExportSVG();
      const serializer = new XMLSerializer();
      let source = serializer.serializeToString(clone);
      if (!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
        source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
      }
      const blob = new Blob([source], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "nato_orbat_chart.svg";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // 导出 2x 超清 PNG（支持透明底板或纯色底板）
    function exportPNG(isTransparent = false) {
      const { clone, cropW, cropH } = getCroppedExportSVG();
      const serializer = new XMLSerializer();
      const svgStr = serializer.serializeToString(clone);

      const canvas = document.createElement("canvas");
      const scale = 2; // 2x 超清渲染
      canvas.width = cropW * scale;
      canvas.height = cropH * scale;
      const ctx = canvas.getContext("2d");

      const img = new Image();
      const svgBlob = new Blob([svgStr], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(svgBlob);

      img.onload = function() {
        if (!isTransparent) {
          ctx.fillStyle = isDark ? "#090D16" : "#F8FAFC";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);

        const a = document.createElement("a");
        a.download = isTransparent ? "nato_orbat_transparent_2x.png" : "nato_orbat_chart_2x.png";
        a.href = canvas.toDataURL("image/png");
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };
      img.src = url;
    }

    window.addEventListener("load", () => {
      initTacticalMatrixPalette();
      renderTree();
      setTimeout(fitToScreen, 60);
    });
    window.addEventListener("resize", () => {
      fitToScreen();
    });
  </script>
